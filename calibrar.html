<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Copa Repsol — Calibrador Fecha 3</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#071629;color:#fff}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:11px 18px;background:#0d2144;border-bottom:1px solid #1a3a60}
.top-bar h1{font-size:16px;color:#4dd9e8}.top-bar h1 em{color:#e8521a;font-style:normal}
.top-bar nav a{color:#4dd9e8;text-decoration:none;padding:5px 12px;border:1px solid #4dd9e8;border-radius:5px;font-size:12px;font-weight:600;margin-left:8px;transition:.2s}
.top-bar nav a:hover{background:#4dd9e8;color:#071629}
.cal-toolbar{display:flex;align-items:center;gap:10px;padding:12px 18px;background:#0d2144;border-bottom:1px solid #1a3a60;flex-wrap:wrap}
.cal-toolbar label{color:#8899aa;font-size:13px}
.cal-toolbar select{padding:6px 10px;background:#071629;border:1px solid #4dd9e8;border-radius:6px;color:#fff;font-size:13px;cursor:pointer}
.btn{padding:7px 16px;border:none;border-radius:6px;font-weight:700;font-size:13px;cursor:pointer;transition:.2s}
.btn-save{background:#e8521a;color:#fff}.btn-save:hover{background:#ff6530}
.btn-reset{background:#1a3a60;color:#4dd9e8;border:1px solid #4dd9e8}.btn-reset:hover{background:#4dd9e8;color:#071629}
.btn-copy{background:#1a5c30;color:#4eff99;border:1px solid #4eff99}.btn-copy:hover{background:#4eff99;color:#071629}
.coord-badge{margin-left:auto;background:#071629;border:1px solid #1a3a60;border-radius:6px;padding:6px 12px;font-family:monospace;font-size:13px;color:#4dd9e8;min-width:160px;text-align:center}
.fs-ctrl{display:flex;align-items:center;gap:6px;font-size:12px;color:#8899aa}
.fs-ctrl input{width:90px;accent-color:#e8521a}
.legend{display:flex;gap:14px;padding:8px 18px;font-size:11px;color:#8899aa;border-bottom:1px solid #1a3a60;flex-wrap:wrap}
.leg-item{display:flex;align-items:center;gap:5px}
.leg-box{width:12px;height:12px;border-radius:3px}
.cal-area{padding:16px 18px;overflow:auto}
.img-container{position:relative;display:inline-block;line-height:0;cursor:crosshair;user-select:none;max-width:100%}
.img-container img{display:block;max-width:100%}
.drag-handle{position:absolute;transform:translate(-50%,-50%);border-radius:4px;padding:2px 5px;font-size:10px;font-weight:800;line-height:1.4;cursor:grab;white-space:nowrap;border:1px solid rgba(0,0,0,.3);box-shadow:0 1px 4px rgba(0,0,0,.5);transition:box-shadow .1s;user-select:none}
.drag-handle:active{cursor:grabbing;box-shadow:0 2px 8px rgba(0,0,0,.8);z-index:100}
.drag-handle.t1{background:rgba(77,217,232,.85);color:#071629}
.drag-handle.t2{background:rgba(232,82,26,.85);color:#fff}
.drag-handle.name{outline:2px solid #000;font-size:11px}
</style>
</head>
<body>

<div class="top-bar">
  <h1>Copa <em>Repsol</em> — Calibrador Fecha 3</h1>
  <nav>
    <a href="admin.html">Admin</a>
    <a href="display.html" target="_blank">Display</a>
  </nav>
</div>

<div class="cal-toolbar">
  <label>Disciplina:</label>
  <select id="discSel" onchange="loadDisc(this.value)">
    <option value="fm">Fútbol Masculino</option>
    <option value="ff">Fútbol Femenino</option>
    <option value="vo">Vóley Mixto</option>
    <option value="pa">Pádel</option>
  </select>
  <div class="fs-ctrl">
    <span>Tamaño:</span>
    <input type="range" id="fsSlider" min="8" max="30" value="13" oninput="onFsChange(this.value)">
    <span id="fsVal">13px</span>
  </div>
  <button class="btn btn-save"  onclick="saveCal()">💾 Guardar</button>
  <button class="btn btn-reset" onclick="resetDisc()">↺ Restablecer</button>
  <button class="btn btn-copy"  onclick="copyJSON()">📋 Copiar JSON</button>
  <div class="coord-badge" id="coordBadge">x: — &nbsp; y: —</div>
</div>

<div class="legend">
  <div class="leg-item"><div class="leg-box" style="background:rgba(77,217,232,.85)"></div> Equipo A (scores)</div>
  <div class="leg-item"><div class="leg-box" style="background:rgba(232,82,26,.85)"></div> Equipo B (scores)</div>
  <div class="leg-item"><div class="leg-box" style="background:rgba(77,217,232,.85);outline:2px solid #000"></div> Nombres</div>
</div>

<div class="cal-area">
  <div class="img-container" id="imgContainer">
    <img id="calImg" src="" alt="">
  </div>
</div>

<script>
const DISC = {
  fm: { name:'Fútbol Masculino', image:'futbol_masculino.jpg', type:'score', matches:[
    {id:'fm_sf_c1',  label:'SF C1', cA:'orange', cB:'orange'},
    {id:'fm_sf_c3',  label:'SF C3', cA:'orange', cB:'orange'},
    {id:'fm_fin_c2', label:'FIN C2',cA:'orange', cB:'orange'}
  ]},
  ff: { name:'Fútbol Femenino', image:'futbol_femenino.jpg', type:'score', matches:[
    {id:'ff_fin_c2', label:'FIN C2', cA:'cyan', cB:'cyan'}
  ]},
  vo: { name:'Vóley Mixto', image:'voley.jpg', type:'sets', matches:[
    {id:'vo_sf_c1',  label:'SF C1', cA:'orange', cB:'cyan'},
    {id:'vo_sf_c2',  label:'SF C2', cA:'cyan',   cB:'orange'},
    {id:'vo_fin_c1', label:'FIN C1',cA:'orange', cB:'cyan'}
  ]},
  pa: { name:'Pádel', image:'padel.jpg', type:'sets', matches:[
    {id:'pa_sf_c1',  label:'SF C1', cA:'orange', cB:'cyan'},
    {id:'pa_sf_c2',  label:'SF C2', cA:'cyan',   cB:'orange'},
    {id:'pa_fin_c3', label:'FIN C3',cA:'orange', cB:'cyan'}
  ]}
};

const CAL_KEY = 'fecha3_cal';

function defaultCal(){
  return {
    fm:{
      fm_sf_c1: {nameA:{x:30.92, y:36.74}, sA:{x:43.3,    y:36.74}, sB:{x:56.88,  y:36.79}, nameB:{x:69.32,  y:36.79}},
      fm_sf_c3: {nameA:{x:31.16, y:52.84}, sA:{x:43.4045, y:52.9846},sB:{x:57.0049,y:52.7689},nameB:{x:69.479,y:52.9306}},
      fm_fin_c2:{nameA:{x:30.92, y:81.23}, sA:{x:43.3236, y:81.2743},sB:{x:57.0858,y:81.3282},nameB:{x:69.2,  y:81.23}}
    },
    ff:{
      ff_fin_c2:{nameA:{x:28.62, y:58.63}, sA:{x:42.51,   y:58.63}, sB:{x:57.79,  y:58.47}, nameB:{x:71.8,   y:58.63}}
    },
    vo:{
      vo_sf_c1: {nameA:{x:32.97, y:34.78}, s1A:{x:45.71,y:34.7},  s2A:{x:54.17,y:34.7},  s3A:{x:62.68,y:34.7},  tA:{x:71.14,y:34.62},
                 nameB:{x:33.27, y:40.17}, s1B:{x:45.77,y:39.77}, s2B:{x:54.23,y:39.85}, s3B:{x:62.74,y:39.93}, tB:{x:71.32,y:39.69}},
      vo_sf_c2: {nameA:{x:33.09, y:54.42}, s1A:{x:45.59,y:54.34}, s2A:{x:54.29,y:54.5},  s3A:{x:62.68,y:54.5},  tA:{x:71.2, y:54.58},
                 nameB:{x:33.33, y:59.81}, s1B:{x:54.23,y:59.65}, s2B:{x:45.71,y:59.81}, s3B:{x:62.62,y:59.73}, tB:{x:71.26,y:59.73}},
      vo_fin_c1:{nameA:{x:32.85, y:85.25}, s1A:{x:45.59,y:85.17}, s2A:{x:54.17,y:85.17}, s3A:{x:62.74,y:85.09}, tA:{x:71.14,y:85.09},
                 nameB:{x:33.15, y:90.41}, s1B:{x:45.83,y:90.41}, s2B:{x:54.11,y:90.32}, s3B:{x:62.86,y:90.32}, tB:{x:71.14,y:90.32}}
    },
    pa:{
      pa_sf_c1: {nameA:{x:33.03, y:34.7},  s1A:{x:45.59,y:34.7},  s2A:{x:54.17,y:34.7},  s3A:{x:62.74,y:34.7},  tA:{x:71.07,y:34.7},
                 nameB:{x:33.21, y:39.93}, s1B:{x:45.59,y:39.85}, s2B:{x:54.17,y:40.01}, s3B:{x:62.68,y:39.85}, tB:{x:71.14,y:39.85}},
      pa_sf_c2: {nameA:{x:33.21, y:54.58}, s1A:{x:45.65,y:54.5},  s2A:{x:54.05,y:54.42}, s3A:{x:62.62,y:54.42}, tA:{x:71.2, y:54.42},
                 nameB:{x:33.33, y:59.81}, s1B:{x:45.71,y:59.81}, s2B:{x:54.11,y:59.81}, s3B:{x:62.68,y:59.73}, tB:{x:71.07,y:59.65}},
      pa_fin_c3:{nameA:{x:32.91, y:85.09}, s1A:{x:45.65,y:85.17}, s2A:{x:54.17,y:85.25}, s3A:{x:62.68,y:85.09}, tA:{x:71.14,y:85.09},
                 nameB:{x:33.15, y:90.57}, s1B:{x:45.71,y:90.24}, s2B:{x:54.11,y:90.32}, s3B:{x:62.74,y:90.41}, tB:{x:71.2, y:90.32}}
    }
  };
}

function loadCal(){ try{ return JSON.parse(localStorage.getItem(CAL_KEY)||'null') || defaultCal(); }catch{ return defaultCal(); } }

let cal = loadCal();
let currentDisc = 'fm';
let handleFs = 13;

function onFsChange(v){
  handleFs = parseInt(v);
  document.getElementById('fsVal').textContent = v + 'px';
  renderHandles();
}

function loadDisc(disc){
  currentDisc = disc;
  const d = DISC[disc];
  const img = document.getElementById('calImg');
  img.onload = renderHandles;
  img.src = d.image;
  if (img.complete && img.naturalWidth > 0) renderHandles();
}

function renderHandles(){
  const container = document.getElementById('imgContainer');
  container.querySelectorAll('.drag-handle').forEach(e=>e.remove());
  const d = DISC[currentDisc];
  const discCal = cal[currentDisc] || {};

  // cls para scores se calcula en tiempo de render usando m.cA / m.cB
  const scoreFieldDefs = d.type==='score'
    ? [{f:'sA',  label:'GOL-A', side:'A'}, {f:'sB',  label:'GOL-B', side:'B'}]
    : [{f:'s1A', label:'S1-A',  side:'A'}, {f:'s2A', label:'S2-A', side:'A'},
       {f:'s3A', label:'S3-A',  side:'A'}, {f:'tA',  label:'TOT-A',side:'A'},
       {f:'s1B', label:'S1-B',  side:'B'}, {f:'s2B', label:'S2-B', side:'B'},
       {f:'s3B', label:'S3-B',  side:'B'}, {f:'tB',  label:'TOT-B',side:'B'}];

  d.matches.forEach(m => {
    const mc = discCal[m.id] || {};

    // Name handles — color de manija según el color real de la cápsula (t2=naranja, t1=cyan)
    [{f:'nameA', label:'EqA '+m.label, color:m.cA}, {f:'nameB', label:'EqB '+m.label, color:m.cB}].forEach(({f,label,color}) => {
      const cls = (color === 'orange' ? 't2' : 't1') + ' name';
      const pos = mc[f] || {x:50, y:50};
      const el = makeHandle(pos, label, cls, m.id, f);
      container.appendChild(el);
    });

    // Score handles — mismo color que la cápsula del equipo correspondiente
    scoreFieldDefs.forEach(({f, label, side}) => {
      const color = side === 'A' ? m.cA : m.cB;
      const cls = color === 'orange' ? 't2' : 't1';
      const pos = mc[f] || {x:50, y:50};
      const el = makeHandle(pos, label+' '+m.label, cls, m.id, f);
      container.appendChild(el);
    });
  });

  updateCoord(null);
}

function makeHandle(pos, label, cls, matchId, field){
  const el = document.createElement('div');
  el.className = 'drag-handle ' + cls;
  el.style.left = pos.x + '%';
  el.style.top  = pos.y + '%';
  el.style.fontSize = handleFs + 'px';
  el.textContent = label;
  el.dataset.matchId = matchId;
  el.dataset.field   = field;
  makeDraggable(el);
  return el;
}

function makeDraggable(el){
  el.addEventListener('mousedown', e => {
    e.preventDefault();
    e.stopPropagation();
    const container = document.getElementById('imgContainer');
    const rect = container.getBoundingClientRect();

    function onMove(ev){
      const x = Math.max(0, Math.min(100, ((ev.clientX-rect.left)/rect.width)*100));
      const y = Math.max(0, Math.min(100, ((ev.clientY-rect.top)/rect.height)*100));
      el.style.left = x.toFixed(2)+'%';
      el.style.top  = y.toFixed(2)+'%';
      updateCoord({x, y});
      // Update cal object live
      const {matchId, field} = el.dataset;
      if (!cal[currentDisc]) cal[currentDisc]={};
      if (!cal[currentDisc][matchId]) cal[currentDisc][matchId]={};
      cal[currentDisc][matchId][field] = {x:parseFloat(x.toFixed(2)), y:parseFloat(y.toFixed(2))};
    }
    function onUp(){
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

function updateCoord(pos){
  const badge = document.getElementById('coordBadge');
  badge.textContent = pos ? `x: ${pos.x.toFixed(1)}%  y: ${pos.y.toFixed(1)}%` : 'x: —  y: —';
}

function saveCal(){
  localStorage.setItem(CAL_KEY, JSON.stringify(cal));
  const badge = document.getElementById('coordBadge');
  const orig = badge.textContent;
  badge.textContent = '✓ Guardado en localStorage';
  badge.style.color = '#22ff88';
  setTimeout(()=>{ badge.textContent=orig; badge.style.color=''; }, 1800);
}

function resetDisc(){
  if (!confirm(`¿Restablecer calibración de ${DISC[currentDisc].name}?`)) return;
  cal[currentDisc] = defaultCal()[currentDisc];
  renderHandles();
}

function copyJSON(){
  const text = JSON.stringify(cal, null, 2);
  const badge = document.getElementById('coordBadge');
  const show = (msg, color) => { badge.textContent=msg; badge.style.color=color; setTimeout(()=>{ badge.textContent='x: —  y: —'; badge.style.color=''; }, 2200); };
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(text).then(()=>show('✓ JSON copiado','#4eff99'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:10px;left:10px;width:90vw;height:80vh;z-index:9999;font-size:11px;font-family:monospace;background:#071629;color:#4eff99;border:2px solid #4eff99;padding:10px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    const btn = document.createElement('button');
    btn.textContent='Cerrar';
    btn.style.cssText='position:fixed;top:10px;right:10px;z-index:10000;padding:8px 16px;background:#e8521a;color:#fff;border:none;border-radius:6px;cursor:pointer';
    btn.onclick=()=>{ ta.remove(); btn.remove(); };
    document.body.appendChild(btn);
    show('✓ JSON copiado','#4eff99');
  }
}

loadDisc('fm');
</script>
</body>
</html>
